version: "3.9"

services:
  api:
    build: .
    container_name: voucher_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: .
    container_name: voucher_worker
    command: ["python", "work.py"]     # 這裡最關鍵
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    container_name: voucher_redis
    ports:
      - "6375:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
